[project]
name = "exif-maker-notes"
version = "0.1.0"
description = "An (opinionated) tool to read EXIF Maker Notes and propagate them to standard EXIF tags."
authors = [{ name = "Tadej Novak", email = "tadej@tano.si" }]
requires-python = ">= 3.11"
readme = "README.md"
license = "MPL-2.0"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "platformdirs == 4.*",
    "pyexiftool == 0.5.*",
    "rich == 15.0.*",
    "typer == 0.27.*",
    "tomli-w == 1.*",
]

[dependency-groups]
dev = [
    "coverage[toml]",
    "mypy == 2.3.1",
    "pre-commit-hooks == 6.0.*",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff == 0.16.3",
    "ty ==0.0.78",
]

[project.scripts]
exifmn = "exif_maker_notes.cli:application"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
source = ["src/exif_maker_notes"]

[tool.coverage.report]
precision = 2
include_namespace_packages = true
exclude_lines = [
    "pragma: no cover",
    "if self.debug:",
    "if debug:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "__repr__",
]
ignore_errors = true

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
preview = true
select = [
    # "ERA",   # eradicate
    "YTT",  # flake8-2020
    "ANN",  # flake8-annotations
    "S",    # flakey-bandit
    "BLE",  # flake8-blind-except
    "FBT",  # flake8-boolean-trap
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "FIX",  # flake8-fixme
    "FA",   # flake8-future-annotations
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "INP",  # flake8-no-pep420
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "SIM",  # flake8-simplify
    "SLOT", # flake8-slots
    "TID",  # flake8-tidy-imports
    "TD",   # flake8-todos
    "TC",   # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "FLY",  # flynt
    "I",    # isort
    "C90",  # mccabe (complexity)
    "N",    # pep8-naming
    "PERF", # perflint
    "E",    # pycodestyle
    "W",    # pycodestyle
    # "DOC",   # pydoclint
    "D",    # pydocstyle
    "F",    # pyflakes
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "UP",   # pyupgrade
    "FURB", # refurb
    "RUF",  # ruff
    "TRY",  # tryceratops
]
ignore = [
    "incorrect-blank-line-before-class", # conflicting with no-blank-line-before-class
    "multi-line-summary-second-line",    # conflicting with multi-line-summary-first-line
    "non-empty-init-module",             # not wanted
]
pylint = { max-args = 12 }

[tool.ruff.lint.per-file-ignores]
"src/exif_maker_notes/cli/__init__.py" = [
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "import-outside-top-level",
]
"**/tests/*" = ["assert"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
all = "error"
missing-override-decorator = "ignore"

[tool.mypy]
strict = true
pretty = true
no_implicit_reexport = false
show_column_numbers = true
show_error_codes = true
show_error_context = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["exiftool.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ignore=src/exif_maker_notes/tests/ --cov=exif_maker_notes --cov-report=term-missing:skip-covered --cov-report xml --cov-report html:coverage --junitxml=junit.xml -o junit_family=legacy"
testpaths = ["tests"]
